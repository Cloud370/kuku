[package]
name = "kuku-app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified binary for the kuku coding agent"
repository = "https://github.com/Cloud370/kuku"
readme = "../../README.md"
keywords = ["agent", "coding", "terminal", "llm", "cli"]
publish = false

[[bin]]
name = "kuku"
path = "src/main.rs"

[features]
default = []
embedded-web-assets = ["dep:rust-embed"]

[dependencies]
kuku-cli = { path = "../../crates/kuku-cli", features = ["server"] }
kuku-server = { path = "../../crates/kuku-server" }
kuku-tui = { path = "../../crates/kuku-tui" }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum = { workspace = true }
rust-embed = { version = "8", optional = true, features = ["debug-embed"] }

[[test]]
name = "interactive_pty"
harness = false
test = false

[dev-dependencies]
kuku = { workspace = true, features = ["test_support"] }
portable-pty = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
vt100 = "0.18"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
