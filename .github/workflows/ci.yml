name: CI
run-name: CI · ${{ github.event_name == 'workflow_dispatch' && inputs.platform || github.event_name == 'schedule' && 'weekly full' || 'selected' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      platform:
        description: Full acceptance platform, or Windows Terminal only
        type: choice
        default: all
        options: [all, linux, macos, windows, windows-desktop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, feat/interactive-clients]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI checks
    runs-on: ubuntu-latest
    outputs:
      platform_jobs: ${{ steps.select.outputs.platform_jobs }}
      web_jobs: ${{ steps.select.outputs.web_jobs }}
      tooling: ${{ steps.select.outputs.tooling }}
      web_checks: ${{ steps.select.outputs.web_checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select checks for this revision
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft && 'true' || 'false' }}
          CI_PLATFORM: ${{ inputs.platform || 'all' }}
        run: >-
          python3 scripts/acceptance/ci_plan.py --event "$CI_EVENT"
          --draft "$CI_DRAFT" --platform "$CI_PLATFORM" --output "$GITHUB_OUTPUT"

  fmt:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'windows-desktop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'windows-desktop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        id: rust_cache
        with:
          cache-on-failure: true
      - name: Report dependency cache restore
        run: >-
          python3 -c "print('Exact Rust dependency cache hit: ${{ steps.rust_cache.outputs.cache-hit }}')"
      - run: cargo clippy --workspace --all-targets --features kuku/test_support -- -D warnings
      - run: mkdir -p apps/web/dist && cp apps/web/index.html apps/web/dist/
      - run: cargo check -p kuku-app --features embedded-web-assets

  tooling:
    needs: plan
    name: Acceptance tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.tooling) }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/acceptance -p "test_*.py"

  web-assets:
    name: Build shared Web assets
    needs: plan
    if: ${{ needs.plan.outputs.web_jobs != '[]' }}
    uses: ./.github/workflows/web-ci.yml
    with:
      verify: ${{ needs.plan.outputs.web_checks == 'true' }}
      publish-assets: true

  platform:
    name: Rust and native checks
    needs: plan
    if: ${{ needs.plan.outputs.platform_jobs != '[]' }}
    uses: ./.github/workflows/ci-platform.yml
    with:
      matrix: ${{ needs.plan.outputs.platform_jobs }}

  web-platform:
    name: Checks using embedded Web assets
    needs: [plan, web-assets]
    uses: ./.github/workflows/ci-platform.yml
    with:
      matrix: ${{ needs.plan.outputs.web_jobs }}
