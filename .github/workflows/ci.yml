name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-process-probe:
    name: Darwin process group probe
    runs-on: macos-latest
    steps:
      - name: Observe the group before reaping its leader
        run: |
          cat > "$RUNNER_TEMP/kuku-group.c" <<'EOF'
          #include <errno.h>
          #include <signal.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>
          int main(void) {
              pid_t child = fork();
              if (child < 0) return 1;
              if (!child) _exit(setpgid(0, 0) ? 3 : 0);
              siginfo_t info = {0};
              errno = 0;
              int observed = waitid(P_PID, child, &info, WEXITED | WNOWAIT);
              printf("waitid exited result=%d errno=%d pid=%d code=%d status=%d\n",
                     observed, errno, info.si_pid, info.si_code, info.si_status);
              if (!observed && info.si_pid == child && !info.si_status) {
                  memset(&info, 0, sizeof(info));
                  errno = 0;
                  int again = waitid(P_PID, child, &info, WEXITED | WNOHANG | WNOWAIT);
                  printf("waitid peek result=%d errno=%d pid=%d\n", again, errno, info.si_pid);
                  errno = 0;
                  int exists = kill(-child, 0);
                  printf("kill group zero result=%d errno=%d\n", exists, errno);
                  errno = 0;
                  int stop = kill(-child, SIGKILL);
                  printf("kill group SIGKILL result=%d errno=%d\n", stop, errno);
              }
              int status = 0;
              errno = 0;
              int reaped = waitpid(child, &status, 0);
              printf("waitpid result=%d errno=%d status=%d\n", reaped, errno, status);
              return reaped == child ? 0 : 1;
          }
          EOF
          cc -Wall -Wextra -o "$RUNNER_TEMP/kuku-group" "$RUNNER_TEMP/kuku-group.c"
          "$RUNNER_TEMP/kuku-group"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features kuku/test_support -- -D warnings
      - run: mkdir -p apps/web/dist && cp apps/web/index.html apps/web/dist/
      - run: cargo check -p kuku-app --features embedded-web-assets

  test:
    name: Contract and installed client (${{ matrix.terminal }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            terminal: Linux PTY
          - os: macos-latest
            terminal: macOS PTY
          - os: windows-latest
            terminal: Windows ConPTY
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check acceptance tooling
        run: python3 -m unittest discover -s scripts/acceptance -p "test_*.py"
      - name: Prepare isolated Windows Terminal desktop
        id: windows_desktop
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts/acceptance/desktop/windows_setup.py --report benchmarks/acceptance/windows-terminal-preflight.json --prepare "$env:RUNNER_TEMP/kuku-windows-terminal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preflight = Get-Content benchmarks/acceptance/windows-terminal-preflight.json -Raw | ConvertFrom-Json
          "terminal=$($preflight.terminal)" >> $env:GITHUB_OUTPUT
      - name: Contract tests, including feature-gated runtime suites
        id: contract
        run: python3 scripts/acceptance/run.py --run-id ci-contract contract
      - name: Installed client on ${{ matrix.terminal }}
        if: ${{ !cancelled() && (steps.contract.outcome == 'success' || steps.contract.outcome == 'failure') }}
        env:
          KUKU_ACCEPTANCE_WINDOWS_TERMINAL: ${{ steps.windows_desktop.outputs.terminal }}
        run: >-
          python3 scripts/acceptance/run.py --run-id ci-interactive interactive
          ${{ steps.windows_desktop.outcome == 'success' && '--desktop --windows-terminal "$env:KUKU_ACCEPTANCE_WINDOWS_TERMINAL"' || '' }}
      - name: Upload bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            benchmarks/acceptance/ci-contract
            benchmarks/acceptance/ci-interactive
            benchmarks/acceptance/windows-terminal-preflight.json
          if-no-files-found: ignore
