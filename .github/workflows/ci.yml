name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features kuku/test_support -- -D warnings
      - run: mkdir -p apps/web/dist && cp apps/web/index.html apps/web/dist/
      - run: cargo check -p kuku-app --features embedded-web-assets

  test:
    name: Contract and installed client (${{ matrix.terminal }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            terminal: Linux PTY
          - os: macos-latest
            terminal: macOS PTY
          - os: windows-latest
            terminal: Windows ConPTY
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check acceptance tooling
        run: python3 -m unittest discover -s scripts/acceptance -p "test_*.py"
      - name: Contract tests, including feature-gated runtime suites
        run: python3 scripts/acceptance/run.py --run-id ci-contract contract
      - name: Installed client on ${{ matrix.terminal }}
        run: python3 scripts/acceptance/run.py --run-id ci-interactive interactive
      - name: Upload bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            benchmarks/acceptance/ci-contract
            benchmarks/acceptance/ci-interactive
          if-no-files-found: ignore
