name: CI

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        type: choice
        options:
          - fast
          - full
        default: fast
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/web-ci.yml"
      - "apps/web/**"
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/workflows/web-ci.yml"
      - "apps/web/**"
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"

env:
  CARGO_TERM_COLOR: always
  CI_PROFILE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')) && 'full' || 'fast' }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo clippy -- -D warnings

  test:
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ runner.os == 'Linux' && 'full' || env.CI_PROFILE }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-${{ runner.os == 'Linux' && 'full' || env.CI_PROFILE }}-
      - name: Run full Rust test suite
        if: runner.os == 'Linux' || env.CI_PROFILE == 'full'
        run: cargo test -p kuku -p kuku-cli -p kuku-server
      - name: Run native platform smoke tests
        if: runner.os != 'Linux' && env.CI_PROFILE == 'fast'
        run: |
          cargo test -p kuku-server --test platform_bootstrap_test --test platform_contract_test --test platform_routes_test --test platform_security_test --test workspace_registry_test
          cargo test -p kuku --test session_paths --test workspace_capability_access
          cargo test -p kuku-cli --lib
