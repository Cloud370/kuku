name: CI
run-name: CI · ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform for full acceptance (all for release candidates)
        type: choice
        default: all
        options: [all, linux, macos, windows]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, feat/interactive-clients]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        id: rust_cache
        with:
          cache-on-failure: true
      - name: Report dependency cache restore
        run: >-
          python3 -c "print('Exact Rust dependency cache hit: ${{ steps.rust_cache.outputs.cache-hit }}')"
      - run: cargo clippy --workspace --all-targets --features kuku/test_support -- -D warnings
      - run: mkdir -p apps/web/dist && cp apps/web/index.html apps/web/dist/
      - run: cargo check -p kuku-app --features embedded-web-assets

  tooling:
    name: Acceptance tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/acceptance -p "test_*.py"

  web-assets:
    name: Build shared Web assets
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: installed-web-assets
          path: apps/web/dist
          if-no-files-found: error

  test:
    name: ${{ github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest' && 'Native smoke' || 'Contract' }} (${{ matrix.terminal }})
    needs: [fmt, web-assets]
    if: ${{ !cancelled() && needs.fmt.result == 'success' }}
    env:
      INSTALLED_ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
      PR_ACCEPTANCE: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
      NATIVE_SMOKE: ${{ github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest' }}
      CARGO_PROFILE_DEV_DEBUG: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && '0' || '2' }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            (inputs.platform == 'linux' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft)) && '[{"os":"ubuntu-latest","terminal":"Linux PTY"}]' ||
            inputs.platform == 'macos' && '[{"os":"macos-latest","terminal":"macOS PTY"}]' ||
            inputs.platform == 'windows' && '[{"os":"windows-latest","terminal":"Windows ConPTY"}]' ||
            '[{"os":"ubuntu-latest","terminal":"Linux PTY"},{"os":"macos-latest","terminal":"macOS PTY"},{"os":"windows-latest","terminal":"Windows ConPTY"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust_cache
        with:
          cache-on-failure: true
      - name: Report dependency cache restore
        run: >-
          python3 -c "print('Exact Rust dependency cache hit: ${{ steps.rust_cache.outputs.cache-hit }}')"
      - name: Fingerprint the installed build toolchain
        id: install_identity
        if: ${{ !cancelled() && env.INSTALLED_ACCEPTANCE == 'true' }}
        run: >-
          python3 -c "import hashlib, os, subprocess;
          print('compiler=' + hashlib.sha256(subprocess.check_output(['rustc', '-vV'])).hexdigest(),
          file=open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8'))"
      - name: Restore installed binary for this revision
        id: installed_cache
        if: ${{ !cancelled() && steps.install_identity.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kuku-ci-install/bin
          key: kuku-installed-v2-${{ env.PR_ACCEPTANCE == 'true' && 'debug' || 'release' }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ steps.install_identity.outputs.compiler }}
      - name: Download shared Web assets
        id: web_dist
        if: ${{ !cancelled() && env.INSTALLED_ACCEPTANCE == 'true' && needs.web-assets.result == 'success' && (steps.installed_cache.outputs.cache-hit != 'true' || (env.PR_ACCEPTANCE == 'true' && env.NATIVE_SMOKE != 'true')) }}
        uses: actions/download-artifact@v4
        with:
          name: installed-web-assets
          path: apps/web/dist
      - name: Contract tests, including feature-gated runtime suites
        id: contract
        if: ${{ !cancelled() && env.NATIVE_SMOKE != 'true' }}
        run: >-
          python3 scripts/acceptance/run.py --run-id ci-contract contract
          ${{ env.PR_ACCEPTANCE == 'true' && steps.web_dist.outcome == 'success' && '--embedded-web-assets' || '' }}
      - name: Upload contract evidence immediately
        if: ${{ !cancelled() && (steps.contract.outcome == 'success' || steps.contract.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: contract-${{ matrix.os }}
          path: benchmarks/acceptance/ci-contract
          if-no-files-found: ignore
      - name: Prepare application binary for acceptance
        id: install
        if: ${{ !cancelled() && steps.web_dist.outcome == 'success' && steps.installed_cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          KUKU_INSTALLED_BINARY: ${{ runner.temp }}/kuku-ci-install/bin/kuku${{ runner.os == 'Windows' && '.exe' || '' }}
          KUKU_INSTALL_ROOT: ${{ runner.temp }}/kuku-ci-install
        run: |
          if [[ "$PR_ACCEPTANCE" == true ]]; then
            cargo build --locked --timings -p kuku-app --features embedded-web-assets,kuku/test_support
            python3 -c 'import os, shutil; from pathlib import Path
          destination = Path(os.environ["KUKU_INSTALLED_BINARY"])
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(Path(os.environ["CARGO_TARGET_DIR"]) / "debug" / destination.name, destination)'
          else
            cargo install --locked --timings --path apps/kuku --features embedded-web-assets --root "$KUKU_INSTALL_ROOT"
          fi
      - name: Verify installed revision
        id: installed_revision
        if: ${{ !cancelled() && (steps.install.outcome == 'success' || steps.installed_cache.outputs.cache-hit == 'true') }}
        env:
          KUKU_INSTALLED_BINARY: ${{ runner.temp }}/kuku-ci-install/bin/kuku${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >-
          python3 -c "import os, subprocess;
          version = subprocess.check_output([os.environ['KUKU_INSTALLED_BINARY'], '--version'], text=True).strip();
          expected = '(' + subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD'], text=True).strip() + ')';
          assert version.endswith(expected), (version, expected); print(version)"
      - name: Cache the verified installed binary
        if: ${{ !cancelled() && steps.installed_revision.outcome == 'success' && steps.install.outcome == 'success' && steps.installed_cache.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kuku-ci-install/bin
          key: ${{ steps.installed_cache.outputs.cache-primary-key }}
      - name: Prepare isolated Windows Terminal desktop
        id: windows_desktop
        if: ${{ !cancelled() && steps.installed_revision.outcome == 'success' && env.NATIVE_SMOKE != 'true' && runner.os == 'Windows' }}
        timeout-minutes: 5
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 scripts/acceptance/desktop/windows_setup.py --report benchmarks/acceptance/windows-terminal-preflight.json --prepare "$env:RUNNER_TEMP/kuku-windows-terminal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preflight = Get-Content benchmarks/acceptance/windows-terminal-preflight.json -Raw | ConvertFrom-Json
          "terminal=$($preflight.terminal)" >> $env:GITHUB_OUTPUT
      - name: Prepare browser handoff
        if: ${{ !cancelled() && steps.installed_revision.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          python3 -m pip install playwright==1.64.1
          python3 -m playwright install --with-deps chromium
      - name: Restore native PTY helper
        id: pty_cache
        if: ${{ !cancelled() && steps.installed_revision.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kuku-ci-pty
          key: kuku-pty-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ steps.install_identity.outputs.compiler }}-${{ hashFiles('apps/kuku/tests/**', 'apps/kuku/Cargo.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/**') }}
      - name: Installed client on ${{ matrix.terminal }}
        id: interactive
        if: ${{ !cancelled() && steps.installed_revision.outcome == 'success' }}
        env:
          KUKU_ACCEPTANCE_WINDOWS_TERMINAL: ${{ steps.windows_desktop.outputs.terminal }}
        run: >-
          python3 scripts/acceptance/run.py --run-id ci-interactive interactive
          --binary "${{ runner.temp }}/kuku-ci-install/bin/kuku${{ runner.os == 'Windows' && '.exe' || '' }}"
          --bridge-cache "${{ runner.temp }}/kuku-ci-pty/interactive_pty${{ runner.os == 'Windows' && '.exe' || '' }}"
          ${{ env.NATIVE_SMOKE == 'true' && '--native-smoke' || '' }}
          ${{ runner.os == 'Windows' && env.NATIVE_SMOKE != 'true' && '--desktop --windows-terminal "$env:KUKU_ACCEPTANCE_WINDOWS_TERMINAL"' || '' }}
          ${{ runner.os == 'Linux' && '--browser' || '' }}
      - name: Cache the validated native PTY helper
        if: ${{ !cancelled() && steps.interactive.outcome == 'success' && steps.pty_cache.outcome == 'success' && steps.pty_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kuku-ci-pty
          key: ${{ steps.pty_cache.outputs.cache-primary-key }}
      - name: Upload bounded acceptance evidence
        if: ${{ always() && env.INSTALLED_ACCEPTANCE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            benchmarks/acceptance/ci-contract
            benchmarks/acceptance/ci-interactive
            benchmarks/acceptance/windows-terminal-preflight.json
          if-no-files-found: ignore
      - name: Upload Cargo build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-timings-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
