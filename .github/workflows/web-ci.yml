name: WebUI CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/web-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/kuku/**"
      - "apps/web/**"
      - "crates/kuku/**"
      - "crates/kuku-server/**"
      - "scripts/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: webui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: A0 Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/web
      - name: Verify canonical generated contract
        run: |
          cargo run -p kuku-server --bin export-web-contract -- apps/web/src/api/generated
          git diff --exit-code -- apps/web/src/api/generated
      - run: npm run generate:api
        working-directory: apps/web
      - run: git diff --exit-code -- apps/web/src/api/generated
      - run: npm run test:unit -- src/api
        working-directory: apps/web

  deterministic-backend:
    name: A1 Deterministic Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kuku-server --features test-scenarios --test scenario_server_test

  web-static:
    name: A2 Static and Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run test:unit
        working-directory: apps/web
      - run: npm run test:storybook
        working-directory: apps/web
      - run: npm run build-storybook
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-a2-${{ github.sha }}
          path: |
            apps/web/storybook-static
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  embedded-chromium:
    name: A3 Embedded Chromium
    runs-on: ubuntu-latest
    needs: [contract, deterministic-backend, web-static]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: cargo build -p kuku-app --features embedded-web-assets,test-scenarios
      - name: Run embedded Chromium journeys
        working-directory: apps/web
        run: npm run test:e2e -- --project=chromium --ignore-snapshots
      - name: Build A3 candidate manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/a3
          node --input-type=module <<'EOF'
          import { writeFile } from 'node:fs/promises';
          import {
            buildCandidateIdentity,
            hashAcceptanceHarness,
            hashPath,
          } from './apps/web/scripts/acceptance-human.mjs';
          const identity = buildCandidateIdentity({
            sourceSha: process.env.SOURCE_SHA,
            binaryHash: await hashPath('./target/debug/kuku'),
            assetsHash: await hashPath('./apps/web/dist'),
            contractHash: await hashPath('./apps/web/src/api/generated/manifest.json'),
            baselineHash: await hashPath('./apps/web/e2e/__screenshots__'),
            scenarioHash: await hashPath('./crates/kuku-server/tests/fixtures/scenarios/human_acceptance.json'),
            harnessHash: await hashAcceptanceHarness(),
            scenario: 'human_acceptance',
            seed: 7,
          });
          const manifest = { gate: 'h1-h2', ...identity };
          await writeFile('./artifacts/a3/manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          EOF
      - name: Upload authoritative A3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: webui-a3-${{ github.sha }}
          path: artifacts/a3/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload A3 failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webui-a3-failures-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 30

  visual:
    name: A3 Fixed Visual
    runs-on: ubuntu-latest
    needs: [contract, deterministic-backend, web-static]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: cargo build -p kuku-app --features embedded-web-assets,test-scenarios
      - run: npm run test:e2e:visual
        working-directory: apps/web
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-a3-visual-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 30

  required:
    name: WebUI Required
    if: always()
    needs:
      [contract, deterministic-backend, web-static, embedded-chromium, visual]
    runs-on: ubuntu-latest
    steps:
      - name: Require A0 through A3 only
        env:
          CONTRACT: ${{ needs.contract.result }}
          BACKEND: ${{ needs.deterministic-backend.result }}
          STATIC: ${{ needs.web-static.result }}
          EMBEDDED: ${{ needs.embedded-chromium.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          test "$CONTRACT" = success
          test "$BACKEND" = success
          test "$STATIC" = success
          test "$EMBEDDED" = success
          test "$VISUAL" = success
