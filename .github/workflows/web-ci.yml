name: WebUI CI
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  workflow_call:
    inputs:
      verify:
        type: boolean
        default: true
      publish-assets:
        type: boolean
        default: false

concurrency:
  group: webui-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        if: ${{ inputs.verify || github.event_name == 'push' }}
        working-directory: apps/web
      - run: npm run lint
        if: ${{ inputs.verify || github.event_name == 'push' }}
        working-directory: apps/web
      - run: npm run test
        if: ${{ inputs.verify || github.event_name == 'push' }}
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.publish-assets }}
        with:
          name: installed-web-assets
          path: apps/web/dist
          if-no-files-found: error
