name: WebUI CI
on:
  push:
    paths:
      - "apps/web/**"
      - "apps/kuku/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/acceptance/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/kuku/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/acceptance/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: webui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  installed-browser:
    name: Installed WebUI handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Chromium for Playwright
        run: |
          python3 -m pip install playwright==1.64.1
          python3 -m playwright install --with-deps chromium
      - name: Check terminal and browser handoff from an installed binary
        run: python3 scripts/acceptance/run.py --run-id ci-interactive-browser interactive --browser
      - name: Upload bounded browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-browser-linux
          path: benchmarks/acceptance/ci-interactive-browser
          if-no-files-found: ignore
