name: WebUI CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/web-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/kuku/**"
      - "apps/web/**"
      - "crates/kuku/**"
      - "crates/kuku-server/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/web-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/kuku/**"
      - "apps/web/**"
      - "crates/kuku/**"
      - "crates/kuku-server/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: webui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: A0 Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: npm ci
        working-directory: apps/web
      - name: Verify canonical generated contract
        run: |
          cargo run -p kuku-server --bin export-web-contract -- apps/web/src/api/generated
          git diff --exit-code -- apps/web/src/api/generated
      - run: npm run generate:api
        working-directory: apps/web
      - run: git diff --exit-code -- apps/web/src/api/generated
      - run: npm run test:unit -- src/api
        working-directory: apps/web

  deterministic-backend:
    name: A1 Deterministic Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo test -p kuku-server --features test-scenarios --test scenario_server_test

  web-static:
    name: A2 Static and Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run test:unit
        working-directory: apps/web
      - run: npm run test:storybook
        working-directory: apps/web
      - run: npm run build-storybook
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Upload static failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webui-static-failures-${{ github.sha }}
          path: |
            apps/web/storybook-static
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  embedded-chromium:
    name: A3 Embedded Chromium
    runs-on: ubuntu-latest
    needs: [contract, deterministic-backend, web-static]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: cargo build -p kuku-app --features embedded-web-assets,test-scenarios
      - name: Run embedded Chromium journeys
        working-directory: apps/web
        run: npm run test:e2e -- --project=chromium --ignore-snapshots
      - name: Upload A3 failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webui-a3-failures-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 30

  required:
    name: WebUI Required
    if: always()
    needs:
      [contract, deterministic-backend, web-static, embedded-chromium]
    runs-on: ubuntu-latest
    steps:
      - name: Require A0 through A3
        env:
          CONTRACT: ${{ needs.contract.result }}
          BACKEND: ${{ needs.deterministic-backend.result }}
          STATIC: ${{ needs.web-static.result }}
          EMBEDDED: ${{ needs.embedded-chromium.result }}
        run: |
          test "$CONTRACT" = success
          test "$BACKEND" = success
          test "$STATIC" = success
          test "$EMBEDDED" = success
