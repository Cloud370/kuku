name: Docs Translate Open PR

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: English docs page, for example docs/en/start/install.md
        required: true
        type: string
      locale:
        description: Target locale directory
        required: true
        default: zh
        type: string
      base_branch:
        description: PR base branch. Defaults to the workflow ref branch or the specified PR's base.
        type: string
      branch_name:
        description: New translation branch name. Defaults to an automatically generated name.
        type: string
      pr_number:
        description: Open same-repository PR to update
        type: string

permissions:
  contents: read

concurrency:
  group: docs-translate-open-pr-${{ inputs.pr_number || inputs.branch_name || github.run_id }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Cache container runtime build state
        uses: actions/cache@v4
        with:
          path: |
            /tmp/kuku/docs-translate-ci/target
            /tmp/kuku/docs-translate-ci/cargo-home
            /tmp/kuku/docs-translate-ci/rustup
          key: docs-translate-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'apps/**/Cargo.toml', 'crates/**/Cargo.toml', 'scripts/docs-translate/Dockerfile') }}
          restore-keys: |
            docs-translate-runtime-${{ runner.os }}-

      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/docs-translate/Dockerfile
          tags: kuku-agent-runner:ci
          load: true
          cache-from: type=gha,scope=docs-translate-runner
          cache-to: type=gha,mode=max,scope=docs-translate-runner

      - name: Translate page and publish PR
        env:
          GH_TOKEN: ${{ github.token }}
          KUKU_AGENT_RUNNER_IMAGE: kuku-agent-runner:ci
          KUKU_CACHE_ROOT: /tmp/kuku/docs-translate-ci
          KUKU_ENV_FILE: /dev/null
          CI_LLM_BASE_URL: ${{ secrets.CI_LLM_BASE_URL }}
          CI_LLM_API_KEY: ${{ secrets.CI_LLM_API_KEY }}
          CI_LLM_MODEL: ${{ vars.CI_LLM_MODEL }}
          INPUT_SOURCE_PATH: ${{ inputs.source_path }}
          INPUT_LOCALE: ${{ inputs.locale }}
          INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
          INPUT_BRANCH_NAME: ${{ inputs.branch_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/docs-translate/translate-page-and-open-pr.sh --locale "$INPUT_LOCALE" \
            --base "$INPUT_BASE_BRANCH" --branch "$INPUT_BRANCH_NAME" --pr "$INPUT_PR_NUMBER" \
            "$INPUT_SOURCE_PATH"
