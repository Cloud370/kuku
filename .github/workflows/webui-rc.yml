name: WebUI Release Candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact promoted candidate SHA; dispatch this workflow at the same ref"
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: webui-rc-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  verify-promotion:
    name: Verify A4 Promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - name: Require exact-SHA promotion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p artifacts/promotion
          gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs" \
            -f per_page=100 > artifacts/check-runs.json
          URL="$(jq -r --arg sha "$SOURCE_SHA" '
            [.check_runs[] | select(
              .name == "WebUI Promotion" and .head_sha == $sha and
              .status == "completed" and .conclusion == "success"
            )] | sort_by(.completed_at) | last | .details_url
          ' artifacts/check-runs.json)"
          RUN_ID="$(printf '%s' "$URL" | sed -n 's#^.*/actions/runs/\([0-9][0-9]*\)/.*#\1#p')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" \
            --name "webui-promotion-$SOURCE_SHA" \
            --dir artifacts/promotion
          jq -e --arg sha "$SOURCE_SHA" '
            .source_sha == $sha and
            (.harness_hash | test("^[a-f0-9]{64}$"))
          ' \
            artifacts/promotion/manifest.json >/dev/null
          jq -e --arg sha "$SOURCE_SHA" --slurpfile promoted artifacts/promotion/manifest.json '
            .source_sha == $sha and
            .reviewed_build_hash == $promoted[0].build_hash and
            .stable_identity.harness_hash == $promoted[0].harness_hash
          ' artifacts/promotion/rebuild/rebuild.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: a5-promotion-input-${{ inputs.source_sha }}
          path: artifacts/promotion
          retention-days: 30

  artifact-smoke:
    name: Package smoke (${{ matrix.platform }})
    needs: verify-promotion
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build clean Web assets
        working-directory: apps/web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          key: webui-rc-${{ matrix.target }}
      - name: Build release executable (Linux)
        if: runner.os == 'Linux'
        run: cross build --release --features embedded-web-assets --target ${{ matrix.target }}
      - name: Build release executable
        if: runner.os != 'Linux'
        run: cargo build --release --features embedded-web-assets --target ${{ matrix.target }}
      - name: Package and extract candidate
        if: runner.os != 'Windows'
        run: |
          mkdir -p package extracted
          cp "target/${{ matrix.target }}/release/kuku" package/kuku
          tar -C package -czf "kuku-${{ matrix.platform }}.tar.gz" kuku
          tar -C extracted -xzf "kuku-${{ matrix.platform }}.tar.gz"
          chmod +x extracted/kuku
      - name: Package and extract candidate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package, extracted | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kuku.exe" package/kuku.exe
          Compress-Archive -Path package/kuku.exe -DestinationPath "kuku-${{ matrix.platform }}.zip"
          Expand-Archive -Path "kuku-${{ matrix.platform }}.zip" -DestinationPath extracted
      - name: Smoke extracted candidate
        if: runner.os != 'Windows'
        run: node scripts/smoke-embedded-web.mjs --binary extracted/kuku --timeout-ms 15000
      - name: Smoke extracted candidate (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-embedded-web.mjs --binary extracted/kuku.exe --timeout-ms 15000
      - uses: actions/upload-artifact@v4
        with:
          name: kuku-${{ matrix.platform }}
          path: kuku-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  browser-behavior:
    name: Browser behavior (${{ matrix.project }})
    needs: [verify-promotion, artifact-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: webkit-360
            browser: webkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: kuku-linux-x86_64
          path: artifacts/package
      - name: Extract Linux candidate
        run: |
          mkdir -p artifacts/extracted
          tar -C artifacts/extracted -xzf artifacts/package/kuku-linux-x86_64.tar.gz
          chmod +x artifacts/extracted/kuku
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web
      - name: Run packaged browser journeys
        working-directory: apps/web
        env:
          KUKU_E2E_BINARY: ${{ github.workspace }}/artifacts/extracted/kuku
          KUKU_E2E_RELEASE_PACKAGE: "1"
        run: >-
          npm run test:e2e -- e2e/release-package.spec.ts
          --project=${{ matrix.project }} --ignore-snapshots
      - name: Upload browser failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-a5-${{ matrix.project }}-${{ inputs.source_sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 30

  a5:
    name: A5 Release Candidate
    if: always()
    needs: [verify-promotion, artifact-smoke, browser-behavior]
    runs-on: ubuntu-latest
    steps:
      - name: Require package and browser results
        env:
          PROMOTION: ${{ needs.verify-promotion.result }}
          PACKAGES: ${{ needs.artifact-smoke.result }}
          BROWSERS: ${{ needs.browser-behavior.result }}
        run: |
          test "$PROMOTION" = success
          test "$PACKAGES" = success
          test "$BROWSERS" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: kuku-*
          path: artifacts/packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: a5-promotion-input-${{ inputs.source_sha }}
          path: artifacts/promotion
      - name: Record exact package identities
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          find artifacts/packages -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum \
            > artifacts/package-sha256sums.txt
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --slurpfile promotion artifacts/promotion/manifest.json \
            --rawfile package_sha256sums artifacts/package-sha256sums.txt \
            '{source_sha: $source_sha, harness_hash: $promotion[0].harness_hash,
              promotion_manifest: $promotion[0],
              package_sha256sums: ($package_sha256sums | split("\n") | map(select(length > 0)))}' \
            > artifacts/a5-manifest.json
          jq -e '
            (.harness_hash | test("^[a-f0-9]{64}$")) and
            .harness_hash == .promotion_manifest.harness_hash
          ' artifacts/a5-manifest.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: webui-a5-${{ inputs.source_sha }}
          path: |
            artifacts/a5-manifest.json
            artifacts/package-sha256sums.txt
          retention-days: 90
