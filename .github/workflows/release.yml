name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release. Leave empty to build packages for the selected ref."
        required: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build WebUI
        working-directory: apps/web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@cross
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: cross build --locked --release --features embedded-web-assets --target ${{ matrix.target }}

      - name: Build binary
        if: runner.os != 'Linux'
        run: cargo build --locked --release --features embedded-web-assets --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../kuku-${{ matrix.platform }}.tar.gz kuku

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/kuku.exe -DestinationPath kuku-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kuku-${{ matrix.platform }}
          path: kuku-${{ matrix.platform }}.*
          if-no-files-found: error

  smoke-linux-arm64:
    needs: build
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-smoke-linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: kuku-linux-aarch64
          path: artifacts
      - name: Install and smoke test the ARM64 release archive
        env:
          PYTHONPATH: scripts/acceptance
        run: |
          export ARM64_INSTALL_DIR="$RUNNER_TEMP/kuku-release-arm64"
          mkdir -p "$ARM64_INSTALL_DIR"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from interactive_fixture import install

          install(
              Path("artifacts/kuku-linux-aarch64.tar.gz").resolve(),
              Path(os.environ["ARM64_INSTALL_DIR"]),
              os.environ,
          )
          PY
          python3 scripts/acceptance/run.py --run-id release-arm64 interactive \
            --binary "$ARM64_INSTALL_DIR/bin/kuku" --native-smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: acceptance-release-linux-aarch64
          path: benchmarks/acceptance/release-arm64

  release:
    if: ${{ github.event_name == 'push' || inputs.tag != '' }}
    needs: [build, smoke-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: kuku-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum kuku-* > sha256sums.txt

      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease
        id: prerelease
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v heading="## [${RELEASE_TAG#v}]" '
              /^## / {
                if (selected) exit
                selected = $0 == heading || index($0, heading " - ") == 1
                next
              }
              selected { print }
            ' CHANGELOG.md > release-notes.md
          fi

      - name: Generate latest.json
        working-directory: artifacts
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          NOTES="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          LINUX_SHA="$(sha256sum kuku-linux-x86_64.tar.gz | awk '{print $1}')"
          LINUX_SIZE="$(wc -c < kuku-linux-x86_64.tar.gz)"
          LINUX_ARM64_SHA="$(sha256sum kuku-linux-aarch64.tar.gz | awk '{print $1}')"
          LINUX_ARM64_SIZE="$(wc -c < kuku-linux-aarch64.tar.gz)"
          DARWIN_SHA="$(sha256sum kuku-darwin-aarch64.tar.gz | awk '{print $1}')"
          DARWIN_SIZE="$(wc -c < kuku-darwin-aarch64.tar.gz)"
          WINDOWS_SHA="$(sha256sum kuku-windows-x86_64.zip | awk '{print $1}')"
          WINDOWS_SIZE="$(wc -c < kuku-windows-x86_64.zip)"
          jq -n \
            --arg v "$VERSION" \
            --arg n "$NOTES" \
            --arg d "$PUB_DATE" \
            --arg b "$BASE" \
            --arg linux_sha "$LINUX_SHA" \
            --argjson linux_size "$LINUX_SIZE" \
            --arg linux_arm64_sha "$LINUX_ARM64_SHA" \
            --argjson linux_arm64_size "$LINUX_ARM64_SIZE" \
            --arg darwin_sha "$DARWIN_SHA" \
            --argjson darwin_size "$DARWIN_SIZE" \
            --arg windows_sha "$WINDOWS_SHA" \
            --argjson windows_size "$WINDOWS_SIZE" \
            '{
              version: $v,
              notes: $n,
              pub_date: $d,
              platforms: {
                "linux-x86_64":   { url: ($b + "/kuku-linux-x86_64.tar.gz"),   sha256: $linux_sha, size: $linux_size },
                "linux-aarch64":  { url: ($b + "/kuku-linux-aarch64.tar.gz"),  sha256: $linux_arm64_sha, size: $linux_arm64_size },
                "darwin-aarch64": { url: ($b + "/kuku-darwin-aarch64.tar.gz"), sha256: $darwin_sha, size: $darwin_size },
                "windows-x86_64": { url: ($b + "/kuku-windows-x86_64.zip"),    sha256: $windows_sha, size: $windows_size }
              },
              desktop: {}
            }' > latest.json

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          files=(
            artifacts/kuku-linux-x86_64.tar.gz
            artifacts/kuku-linux-aarch64.tar.gz
            artifacts/kuku-darwin-aarch64.tar.gz
            artifacts/kuku-windows-x86_64.zip
            artifacts/sha256sums.txt
            artifacts/latest.json
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          flags=(--prerelease="$IS_PRERELEASE")
          if [ "$IS_PRERELEASE" = true ]; then
            flags+=(--latest=false)
          fi

          if gh release view "$RELEASE_TAG" --json isDraft,assets,body > existing-release.json 2> release-lookup.log; then
            if ! jq -e '.isDraft' existing-release.json >/dev/null; then
              for file in "${files[@]}"; do
                if ! jq -e --arg name "${file##*/}" 'any(.assets[]; .name == $name)' existing-release.json >/dev/null; then
                  echo "Published release $RELEASE_TAG is missing ${file##*/}." >&2
                  exit 1
                fi
              done
              echo "Release $RELEASE_TAG is already published with all assets."
              exit 0
            fi

            if ! jq -e '.body | strings | test("\\S")' existing-release.json >/dev/null; then
              printf '\n\n' >> release-notes.md
              gh api --method POST "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body >> release-notes.md
              flags+=(--notes-file release-notes.md)
            fi
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          elif grep -Fxq 'release not found' release-lookup.log; then
            if grep -q '[^[:space:]]' release-notes.md; then
              flags+=(--notes-file release-notes.md)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          else
            cat release-lookup.log >&2
            exit 1
          fi
