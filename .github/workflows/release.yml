name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build Web assets
        working-directory: apps/web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release executable (Linux)
        if: runner.os == 'Linux'
        run: cross build --release -p kuku-app --features embedded-web-assets --target ${{ matrix.target }}
      - name: Build release executable
        if: runner.os != 'Linux'
        run: cargo build --release -p kuku-app --features embedded-web-assets --target ${{ matrix.target }}
      - name: Package and smoke candidate
        if: runner.os != 'Windows'
        run: |
          mkdir -p package extracted
          cp "target/${{ matrix.target }}/release/kuku" package/kuku
          tar -C package -czf "kuku-${{ matrix.platform }}.tar.gz" kuku
          tar -C extracted -xzf "kuku-${{ matrix.platform }}.tar.gz"
          chmod +x extracted/kuku
          node scripts/smoke-embedded-web.mjs --binary extracted/kuku --timeout-ms 15000
      - name: Package and smoke candidate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package, extracted | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kuku.exe" package/kuku.exe
          Compress-Archive -Path package/kuku.exe -DestinationPath "kuku-${{ matrix.platform }}.zip"
          Expand-Archive -Path "kuku-${{ matrix.platform }}.zip" -DestinationPath extracted
          node scripts/smoke-embedded-web.mjs --binary extracted/kuku.exe --timeout-ms 15000
      - uses: actions/upload-artifact@v4
        with:
          name: kuku-${{ matrix.platform }}
          path: kuku-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: kuku-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums and update manifest
        id: release
        working-directory: artifacts
        run: |
          sha256sum kuku-* > sha256sums.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version="${tag#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          jq -n \
            --arg version "$version" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg base "$base" \
            --arg linux_sha "$(sha256sum kuku-linux-x86_64.tar.gz | awk '{print $1}')" \
            --arg darwin_sha "$(sha256sum kuku-darwin-aarch64.tar.gz | awk '{print $1}')" \
            --arg windows_sha "$(sha256sum kuku-windows-x86_64.zip | awk '{print $1}')" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $published_at,
              platforms: {
                "linux-x86_64": {url: ($base + "/kuku-linux-x86_64.tar.gz"), sha256: $linux_sha},
                "darwin-aarch64": {url: ($base + "/kuku-darwin-aarch64.tar.gz"), sha256: $darwin_sha},
                "windows-x86_64": {url: ($base + "/kuku-windows-x86_64.zip"), sha256: $windows_sha}
              },
              desktop: {}
            }' > latest.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: |
            artifacts/kuku-linux-x86_64.tar.gz
            artifacts/kuku-darwin-aarch64.tar.gz
            artifacts/kuku-windows-x86_64.zip
            artifacts/sha256sums.txt
            artifacts/latest.json
