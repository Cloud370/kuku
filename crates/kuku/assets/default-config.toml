# kuku configuration
# Run kuku to configure a connection and choose your default model.
# For manual setup, replace and uncomment these example values.
#
# default_model = { connection = "work", model = "your-model-id" }
#
# [provider.work]
# format = "openai-responses"
# base_url = "https://gateway.example/v1"
# api_key = "$MY_GATEWAY_KEY"
#
# The default pair is registered even without settings below.
# Add a table for each additional pair or to set options for the default pair.
#
# [model.work."your-model-id"]
# context_window = 200000
# max_output_tokens = 8192  # required on native Anthropic Messages

# ── Auto-discovery ────────────────────────────────────────────────────────────
# Auto-scan for skills/ and agents/ subdirectories in:
#   User-level:  ~/.config/*/ and ~/.* (dot dirs, excluding .cache/.cargo/.ssh etc.)
#   Project-level: workspace/.* (e.g. .claude/skills, .opencode/agents)

[discovery]
auto_discover = true
# extra_user_paths = ["/opt/shared/agents"]    # additional user-level paths
# extra_project_paths = [".custom/agents"]     # additional project-level paths

# ── Context handoff ───────────────────────────────────────────────────────────
# When context usage exceeds the threshold, inject a summary of earlier turns
# so the model retains continuity without running out of context window.

[handoff]
enabled = true
threshold = 0.95         # 0.0–1.0, share of available input token budget
keep_turns = 2           # number of recent turns preserved after handoff

# ── Logs ──────────────────────────────────────────────────────────────────────
# JSONL logs are kept separately from session facts under KUKU_HOME/logs/.
# Retention is age-first, then capped by total size across the logs tree.

[logs]
max_age_days = 14
max_total_size_mb = 512

# ── Plugin system ─────────────────────────────────────────────────────────────
# Enable hook execution from .kuku/packages/ extension packages.
# Hooks are external processes that run at lifecycle events (session start/end,
# tool execution, model requests). Packages can also bundle skills.

[plugin]
enabled = true

# ── Update system ─────────────────────────────────────────────────────────────
# Self-update source, release channel, and custom mirror URLs.

[update]
source = "github"        # "github" (default releases) or "mirror" (custom URL)
channel = "stable"       # "stable" or "alpha"
