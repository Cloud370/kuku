[package]
name = "kuku"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "The agent explained — a readable Rust agent SDK"
repository = "https://github.com/Cloud370/kuku"
readme = "../../README.md"
keywords = ["agent", "coding", "terminal", "llm", "cli"]

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
home = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
futures-core = { workspace = true }
tokio-stream = { workspace = true }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "local-offset", "parsing"] }
wreq = { version = "6.0.0-rc.28", default-features = false, features = ["gzip", "json", "socks", "stream"] }
wreq-util = { version = "3.0.0-rc.11", features = ["emulation"] }
httpdate = "1"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
getrandom = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
crc32fast = "1"
fastrand = "2"
flate2 = "1"
regex = "1"
regex-syntax = "0.8"
memchr = "2"
readability = { version = "0.3", default-features = false }
htmd = "0.5"
lru = "0.18"
rpds = { version = "1.2", features = ["serde"] }
url = "2"
toml = { workspace = true }
toml_edit = { workspace = true }
tempfile = "3"
fslock = "0.2"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
minijinja = { version = "3.1", features = ["fuel", "serde"] }

[build-dependencies]
flate2 = "1"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
default = []
test_support = []

[[test]]
name = "provider_integration"
required-features = ["test_support"]

[[test]]
name = "query_runtime"
required-features = ["test_support"]

[dev-dependencies]
boring2 = "5.0.0-alpha.13"
httpmock = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
tokio-boring2 = "5.0.0-alpha.13"
tokio-test = "0.4"
