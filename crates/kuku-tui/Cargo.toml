[package]
name = "kuku-tui"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Interactive terminal client for kuku"
repository = "https://github.com/Cloud370/kuku"
readme = "../../README.md"
publish = false

[lints]
workspace = true

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kuku = { workspace = true }
kuku-client = { path = "../kuku-client" }
open = "5"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tempfile = "3"
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
kuku = { workspace = true, features = ["test_support"] }
httpmock = "0.7"
kuku-server = { path = "../kuku-server" }
vt100 = "0.18"

[target.'cfg(windows)'.dependencies]
termina = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
