[package]
name = "kuku-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CLI for the kuku coding agent"
repository = "https://github.com/Cloud370/kuku"
readme = "../../README.md"
keywords = ["agent", "coding", "terminal", "llm", "cli"]

[lib]
name = "kuku_cli"
path = "src/lib.rs"

[[bin]]
name = "kuku-cli"
path = "src/bin/kuku-cli.rs"

[features]
server = []

[dependencies]
kuku = { workspace = true }
kuku-client = { path = "../kuku-client" }
kuku-server = { path = "../kuku-server" }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }

[dev-dependencies]
kuku = { workspace = true, features = ["test_support"] }
httpmock = "0.7"
tempfile = "3"
wreq = { version = "6.0.0-rc.28", features = ["json"] }
