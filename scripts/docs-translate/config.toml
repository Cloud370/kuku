default_model = { connection = "translation", model = "$CI_LLM_MODEL" }

[model.translation."$CI_LLM_MODEL"]
reasoning_effort = "high"
max_output_tokens = 32768

[provider.translation]
format = "openai-responses"
base_url = "$CI_LLM_BASE_URL"
api_key = "file:/run/kuku-docs-translate.key"
reasoning_efforts = ["high"]
